limit_req_zone $binary_remote_addr zone=bot_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;

# Sarget CRM — Nginx konfiguratsiyasi
# Fayl: /etc/nginx/sites-available/sargetcrm

server {
    listen 80;
    server_name crm.milliycrm.uz;
    # HTTP dan HTTPS ga yo'naltirish
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crm.milliycrm.uz;

    # SSL sertifikati (Let's Encrypt yoki boshqa)
    ssl_certificate     /etc/letsencrypt/live/crm.milliycrm.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.milliycrm.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Xavfsizlik sarlavhalari
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy           "same-origin" always;

    # Bot API rate limiting: IP boshiga minutiga 30 so'rov

    # Static fayllar
    location /static/ {
        alias /opt/sargetcrm/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Media fayllar
    location /media/ {
        alias /opt/sargetcrm/media/;
        # Maxfiy papkalar tashqaridan ko'rinmasin
        location /media/private/ {
            return 403;
        }
    }

    # Bot API endpointlari — rate limiting bilan
    location ~ ^/api/bot/(leads|auth|lead-message)/ {
        limit_req zone=bot_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
        proxy_connect_timeout 10;
    }

    # Health check — tez javob
    location /api/bot/health/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Asosiy CRM — umumiy so'rovlar
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_connect_timeout 10;
        client_max_body_size 10m;
    }

    # Loglash
    access_log /var/log/nginx/sargetcrm_access.log;
    error_log  /var/log/nginx/sargetcrm_error.log warn;
}
