{% extends 'core/base.html' %}
{% block title %}Retsepshenni arxivlash{% endblock %}
{% block content %}
<div class="page-header">
  <div><h1><i class="fas fa-trash" style="color:var(--red)"></i> Retsepshenni arxivlash</h1></div>
  <a href="{% url 'receptionist_list' %}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Orqaga</a>
</div>
<div class="card confirm-delete-card">
  <div class="card-body" style="text-align:center;padding:36px">
    <div class="confirm-delete-icon"><i class="fas fa-headset"></i></div>
    <h3 style="margin-bottom:8px">Ishonchingiz komilmi?</h3>
    <p style="color:var(--text-muted);margin-bottom:24px"><strong style="color:var(--text-primary)">{{ receptionist.name }}</strong> arxivlanadi. Komissiya tarixi saqlanadi, tizimga kirishi to'xtatiladi.</p>
    <form method="post" style="display:flex;gap:12px;justify-content:center">{% csrf_token %}
      <a href="{% url 'receptionist_list' %}" class="btn btn-secondary"><i class="fas fa-xmark"></i> Bekor</a>
      <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Arxivlash</button>
    </form>
  </div>
</div>
{% endblock %}
