{% extends 'core/base.html' %}
{% block title %}Guruhni o'chirish{% endblock %}
{% block content %}
<div class="page-header">
    <div><h1><i class="fas fa-trash-can" style="color:var(--red)"></i> Guruhni o'chirish</h1><p>Amalni tasdiqlang</p></div>
    <a href="{% url 'group_list' %}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Orqaga</a>
</div>
<div class="card delete-confirm-card">
    <div class="card-body" style="padding:40px 32px">
        <div class="delete-icon"><i class="fas fa-triangle-exclamation"></i></div>
        <h2>Guruhni o'chirish</h2>
        <p>Quyidagi guruh o'chiriladi:</p>
        <span class="delete-subject">{{ group.name }}</span>
        <p style="font-size:0.8rem;color:var(--red);margin-bottom:24px"><i class="fas fa-circle-info"></i> Bu amalni qaytarib bo'lmaydi.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-actions" style="justify-content:center;border:none;padding-top:0">
                <a href="{% url 'group_list' %}" class="btn btn-secondary"><i class="fas fa-xmark"></i> Bekor qilish</a>
                <button type="submit" class="btn btn-danger"><i class="fas fa-trash-can"></i> Ha, o'chirish</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
