{% extends 'core/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-header">
  <div><h1><i class="fas fa-file-invoice-dollar"></i> {{ title }}</h1></div>
  <a href="{% url 'expense_list' %}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Orqaga</a>
</div>
<div class="card" style="max-width:520px">
  <div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="form-row">
        <div class="form-group">
          <label><i class="fas fa-tag"></i> Xarajat nomi *</label>{{ form.title }}
        </div>
        <div class="form-group">
          <label><i class="fas fa-list"></i> Kategoriya</label>{{ form.category }}
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label><i class="fas fa-sack-dollar"></i> Summa *</label>{{ form.amount }}
        </div>
        <div class="form-group">
          <label><i class="fas fa-calendar"></i> Sana *</label>{{ form.date }}
        </div>
      </div>
      <div class="form-group">
        <label><i class="fas fa-comment"></i> Izoh</label>{{ form.description }}
      </div>
      <div class="form-actions">
        <a href="{% url 'expense_list' %}" class="btn btn-secondary"><i class="fas fa-xmark"></i> Bekor</a>
        <button type="submit" class="btn btn-primary"><i class="fas fa-floppy-disk"></i> Saqlash</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
